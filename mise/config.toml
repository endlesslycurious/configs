# Global machine setup for Debian/Ubuntu hosts (Raspberry Pi OS + Ubuntu on WSL).
# Apply:  mise bootstrap
# Update: mise self-update && mise upgrade && mise bootstrap packages upgrade
# Docs:   https://mise.jdx.dev/bootstrap.html

# Homebrew-like: shims on PATH for every process, in both bash startup files
[bootstrap.mise_shell_activate]
bash = "shims"

# mise.run installs to ~/.local/bin; put it on PATH before the activation blocks
[dotfiles]
"~/.bashrc/local-bin"       = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }
"~/.bash_profile/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }

# System packages (installed via apt-get; sudo required)
[bootstrap.packages]
"apt:ca-certificates" = "latest"  # TLS root certificates for HTTPS
"apt:curl"            = "latest"  # Internet file retriever (also bootstraps mise)
"apt:git"             = "latest"  # Git source control
"apt:gnupg"           = "latest"  # GnuPG, for apt repository key verification
"apt:python3-venv"    = "latest"  # Python venvs (Mason pip-based tools)
"apt:unzip"           = "latest"  # Zip archive extraction
"apt:wget"            = "latest"  # Internet file retriever

# User-level CLI tools (prebuilt binaries via mise)
[tools]
ast-grep   = "latest"  # Code search and rewriting
aws-cli    = { version = "latest", symlink_bins = "true" }  # AWS CLI v2: SSO login, ECR auth, EKS kubeconfig
bat        = "latest"  # cat with syntax highlighting
btop       = "latest"  # Terminal system monitor
delta      = "latest"  # Syntax-highlighting pager for git and diff output
difftastic = "latest"  # Structural diff
dust       = "latest"  # du replacement
eza        = "latest"  # Modern ls replacement
fd         = "latest"  # find alternative
fzf        = "latest"  # Fuzzy file finder
github-cli = "latest"  # Github cli tools
golangci-lint = "2.14.0"  # Go linter; pinned to match CI (ci-service-workflows service-go-lint)
helm       = "3"       # Kubernetes charts; Helm 3 (3.19+), not 4
herdr      = "latest"  # Agent multiplexer
just       = "latest"  # Command runner
k9s        = "latest"  # Kubernetes TUI
kubectl    = "1.34"    # Kubernetes CLI; keep within one minor of the cluster
lazygit    = "latest"  # Git TUI
neovim     = "latest"  # Modern VIM
oh-my-posh = "latest"  # Prompt theme engine
ripgrep    = "latest"  # Faster grep
tealdeer   = "latest"  # Better man pages (tldr)
tree-sitter = "latest" # Parser CLI (nvim-treesitter builds parsers with it)
yq         = "latest"  # YAML/JSON processor
